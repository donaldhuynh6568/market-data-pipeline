# Tunable rules for the confluence report (market_data_pipeline/reports/confluence_report.py).
# Every threshold the report uses lives here so it can be changed without touching code.
# The report only READS the parquet files in data/; refresh them separately with the collectors.

# Names always shown on the Summary tab. Every ACCELERATING name is added on top (include_accelerating).
focus:
  - META
  - AAPL
  - GOOGL
  - AVGO
  - BTC/USD
  - ETH/USD
  - SOL/USD
  - XLE
include_accelerating: true

rating:
  # ACCELERATING + 4H SIDEWAYS + spot within this fraction of the call wall = WATCH (a live, unresolved test)
  near_wall_threshold: 0.01
  # A regime in this list stops an ACCELERATING name from rating BUY (it rates HOLD instead)
  buy_blocked_regimes: [NEGATIVE_GAMMA, NEAR_FLIP]

targets:
  # Primary target = the reported call wall while it is above spot; once the wall is cleared, the strike with the
  # most call open interest between min_distance and near_band above spot. Stretch = most OI in (near_band, far_band].
  min_distance: 0.01
  near_band: 0.12
  far_band: 0.20
  ladder_rows: 6
  # Only show a stretch target when its call OI is at least this fraction of the primary target's
  stretch_min_oi_ratio: 0.75

insider:
  # Flag a name when open-market sells (code S, disposed) in the window reach both thresholds
  window_days: 90
  min_sells: 20
  min_owners: 3

location:
  # Entry/stop/target levels from daily bars (market_data_pipeline/transforms/location.py).
  # See reference/Location Confluence Playbook.md for the reasoning behind each rule.
  lookback_days: 25          # playbook section 6: precision setups form in roughly the last 20 days
  swing_window: 3            # bars each side to confirm a swing; matches DEFAULT_WINDOW in swing_structure.py
  atr_window: 14
  displacement_atr_mult: 0.8 # candle body vs ATR to call a gap "displacement" — a preference, not a filter
  max_pullback_pct: 0.15     # an entry zone further below spot than this is labelled EXTENDED, not actionable
  # Second, independent qualifier: a zone whose imbalance candle traded well above its own trailing volume.
  # STRONG = price displacement AND volume, CONFIRMED = either one, PLAIN = neither. Entry prefers the best available.
  volume_baseline_window: 20 # daily bars, trailing, excluding the imbalance candle itself
  volume_confirm_mult: 1.5   # volume vs that baseline to count as confirmation
  # Stop distance in average daily ranges (ATR). Set from the two-year backtest: only stops under 1 ATR were
  # clearly bad (-0.114R, n=1350), while 1.0-2.5 ATR came out flat, so 1.5 was penalising setups that were fine.
  min_stop_atr: 1.0

positioning:
  # Summary tab: trend + momentum screen, then confluence layers and a conviction read
  # (market_data_pipeline/reports/positioning.py). Layers are descriptive; none changes rating, size or rank.
  min_abs_score: 0.0           # momentum score magnitude required on top of the 4H structure
  wall_room_pct: 0.03          # long: call wall must be at least this far above spot to count as room
  opens_agree_share: 0.6       # share of available opens spot must sit on the trade's side of
  cot_crowded_percentile: 0.9  # speculator net percentile at/above this reads as crowded (long side)
  funding_crowded: 0.00004     # per-interval perp funding beyond which the paying side is crowded
  rvol_confirm: 1.2            # last completed day's volume vs its 20-day average to count as participation
  high_net: 4                  # conviction = agree minus against, over layers that have data
  medium_net: 2
  # Flow layers (CMF, MFI, OBV, relative strength, trade size, VWAP, profile): shown beside conviction, not in it.
  cmf_threshold: 0.05          # |CMF| beyond this reads as accumulation / distribution
  mfi_with_trend: 55           # long: MFI at/above this is flow with the trend (mirrored 100 - x for shorts)
  mfi_extreme: 80              # ... until this overbought level, where it reads as exhaustion
  rs_threshold: 0.0            # change in close / benchmark that counts as leading or lagging
  trade_size_rising: 1.15      # 5-day avg trade size vs its 60-day baseline that counts as bigger prints
  vwap_agree_share: 0.6        # share of anchored VWAPs spot must sit on the trade's side of
  cot_markets:                 # ticker -> COT market_and_exchange_names (metals only today)
    GLD: "GOLD - COMMODITY EXCHANGE INC."
    SLV: "SILVER - COMMODITY EXCHANGE INC."

flow:
  # Money flow, relative strength, anchored VWAP and volume profile (market_data_pipeline/transforms/flow_indicators.py).
  cmf_window: 20               # daily bars
  mfi_window: 14
  obv_lookback: 20
  rs_short: 20                 # bars for the relative-strength change the vote reads
  rs_long: 60
  profile_sessions: 20         # 5m sessions in the volume profile
  value_area: 0.70
  benchmarks:                  # unlisted names use SPY (equities) or BTC/USD (other crypto)
    ETH/USD: BTC/USD
    SOL/USD: BTC/USD

ict:
  # Opens, session highs/lows and equal highs/lows from 5m/1H bars (market_data_pipeline/transforms/ict_levels.py).
  eq_atr_mult: 0.10            # swing highs/lows within this fraction of 1H ATR count as equal
  min_session_coverage: 0.5    # share of a session's 5m bars needed; equities have no overnight bars so read blank
  sessions:                    # New York time, end 24:00 = midnight
    asia: ["20:00", "24:00"]
    london: ["02:00", "05:00"]

funnel:
  # Stage order and gate semantics live in market_data_pipeline/reports/funnel.py. These are the tunable numbers.
  min_rr: 1.0            # below this is a demerit, never a rejection - R:R ranks, it does not gate
  # Size is driven primarily by the momentum score (see MOMENTUM_TIERS in reports/funnel.py). Zone quality no
  # longer changes size: crossed against momentum quintiles on 3,943 trades it does not order consistently.
  demerit_multiplier: 0.5 # each demerit halves the suggested size
  min_multiplier: 0.125   # floor, so a name with many demerits still shows a minimal size rather than zero

sizing:
  # Fallbacks only. ACCOUNT_SIZE, RISK_PER_TRADE_PCT and MAX_POSITION_PCT in .env win over these, so the real
  # account number never has to live in a tracked file.
  account_size: 25000
  risk_per_trade_pct: 25.0
  max_position_pct: 25

staleness:
  # Warn when a price/options layer is older than the newest layer by more than this many days
  stale_after_days: 3

news:
  # Collector: relevance is HIGH when the headline names the ticker/alias, MEDIUM when the article is tagged to it and
  # to at most this many symbols, otherwise LOW (multi-ticker roundups). The report shows HIGH first, then MEDIUM.
  max_tagged_for_high: 3
  # Company names that count as naming a ticker in a headline (the feed has no company names for equities).
  # Add an entry for any pick you want matched by name; crypto (BTC/ETH/SOL) names are built in.
  aliases:
    AVGO: [Broadcom]
    AMD: [Advanced Micro Devices]
    PANW: [Palo Alto Networks]
    META: [Meta Platforms, Facebook, Zuckerberg]
    GOOGL: [Alphabet, Google]
    AAPL: [Apple]
    NVDA: [Nvidia]
    MSFT: [Microsoft]
    XLE: [Energy Select Sector]
    SMH: [VanEck Semiconductor]
  # Report: newest headlines (HIGH before MEDIUM) within this many days of the newest article, up to headlines_per_name
  lookback_days: 7
  headlines_per_name: 3
  max_headline_chars: 140
  # Keyword screen (prefix match at a word boundary). BUY/WATCH + a negative hit, or SELL + a positive hit, adds a
  # "REVIEW NEWS" flag (only headlines naming the asset count); ratings never change. This is a screen, not sentiment analysis.
  negative_keywords: [downgrade, probe, investigation, lawsuit, sued, recall, plunge, slump, subpoena, fraud, layoff, misses, cuts guidance, lowers guidance, guidance cut, warning]
  positive_keywords: [upgrade, beats, raises guidance, raised guidance, price target raised, surge]
