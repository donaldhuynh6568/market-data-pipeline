[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-data-pipeline"
version = "0.1.0"
description = "Market data pipeline: collectors -> raw parquet -> dbt (DuckDB) staging/marts -> momentum simulation."
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.44.0",
    "dbt-duckdb>=1.9.0",
    "duckdb>=1.1.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pyarrow>=17.0.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
notebook = [
    "jupyterlab>=4.2.0",
    "matplotlib>=3.9.0",
    "nbconvert>=7.16.0",
]

[tool.uv]
package = true

[tool.ruff.lint]
# Standard pycodestyle errors + pyflakes — the practical default. Broad
# except / naive-datetime rules are skipped on purpose: this is a personal
# collection script, not a library, and best-effort error handling is the
# intended behavior (a failed ticker is skipped, not fatal).
select = ["E4", "E7", "E9", "F"]
