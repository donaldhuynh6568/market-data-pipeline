# Machine-readable companion to orderflow_strategy_playbook.md.
# Concrete thresholds/mappings only — see the playbook for full explanation
# and reasoning. Every number here traces back to either
# orderflow_pipeline_buildout_plan.md or an actual constant in
# market_data_pipeline/transforms/gex.py — nothing here is invented.

session:
  trading_window: "first_1.5h_of_NY_open"
  alt_window: "asia_session"
  min_volume_per_5min_candle_contracts: 20000
  min_volume_check:
    source_file: market_data_pipeline/collectors/futures_volume.py
    source_output: data/futures_volume_5m.parquet
    field: volume_floor_met
    status: built
    default_tickers: ["MNQ=F", "MES=F", "SIL=F"]
    caveats: >
      Unofficial Yahoo Finance endpoint (no SLA), ~10 minute delay confirmed
      live during development, ~60-day intraday history limit. Alpaca has no
      futures data at all, so this was the only free option found.
  max_consecutive_losses: 2
  strategy_hopping_allowed: false
  track_execution_quality_separately_from_pnl: true
  target_performance:
    win_rate_pct: [60, 65]
    profit_factor: 1.8
    avg_winner_r: 1.5

environment:
  mode: regime_only # Mode A, not Mode B — see playbook §1 for why
  mode_note: >
    GEX is used to set expectations for market character (choppy vs.
    trending), not as tradeable support/resistance levels. Mode B (levels)
    would require the FVG/swing-structure layer this pipeline doesn't have.
  gex:
    source_file: market_data_pipeline/transforms/gex.py
    source_output: data/gex_data.parquet
    near_flip_threshold: 0.01 # matches NEAR_FLIP_THRESHOLD in gex.py exactly
    regimes:
      POSITIVE_GAMMA: "dealer hedging dampens moves; expect choppier/pinned character"
      NEGATIVE_GAMMA: "dealer hedging amplifies moves; expect faster/trending character"
      NEAR_FLIP: "regime unstable, spot within near_flip_threshold of gamma_flip; lowest-confidence read"
  macro_context:
    source_file: market_data_pipeline/collectors/fred.py
    source_output: data/fred_data.parquet
    note: "secondary context only, not day-specific"
  cot_positioning:
    source_file: market_data_pipeline/collectors/cot.py
    source_output: data/cot_data.parquet
    scope: "metals only (gold/silver), weekly/report-lagged"
  intraday_structure:
    source_file: market_data_pipeline/transforms/swing_structure.py
    source_output: "data/swing_structure_1h.parquet, data/swing_structure_4h.parquet"
    upstream_source_file: market_data_pipeline/collectors/price.py
    upstream_source_output: "data/price_data_1h.parquet, data/price_data_4h.parquet"
    status: built
    swing_window_bars: 3 # matches DEFAULT_WINDOW in swing_structure.py exactly
    structures:
      UPTREND: "higher confirmed swing high and higher confirmed swing low"
      DOWNTREND: "lower confirmed swing high and lower confirmed swing low"
      SIDEWAYS: "mixed signal between the last two swing highs/lows"
      UNKNOWN: "fewer than 2 swing highs or lows confirmed yet — not enough history, not a real sideways read"
    note: >
      Confirmed live during development: SHV (low-volatility short-term
      Treasury ETF) returned UNKNOWN on the 4H timeframe for exactly this
      reason — too little movement to confirm two swings in 30 days.

location:
  source_file: null
  source_output: null
  status: not_built
  note: >
    Fibonacci retracement / golden-pocket zones / FVG — no TA logic for this
    exists yet. Partially unblocked: swing_structure.py's find_swing_points()
    now produces the actual swing-high/low values a Fib calculation would be
    built from, they just aren't turned into retracement zones yet.

confirmation:
  source_file: null
  source_output: null
  status: not_built
  note: >
    Footprint candles (volume-at-price + bid/ask delta), tick-level
    Lee-Ready classification. Requires SIP tick data and ideally an
    aggressor-tagged options sweep feed — see
    orderflow_pipeline_buildout_plan.md Phase 1-3 for the build-out roadmap.

execution:
  source_file: null
  source_output: null
  status: not_built
  note: "No trade journal, position tracking, or order management exists in this pipeline"

status_summary:
  environment: built # both GEX regime and intraday structure are now automated
  location: manual_only
  confirmation: manual_only
  execution: manual_only
