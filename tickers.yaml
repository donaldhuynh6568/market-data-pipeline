# Ticker universe for the rotation-strategy data pipeline.
# Add new symbols under the relevant category — collector scripts read this file
# at runtime, so growing the universe never means touching code.
#
# equities: anything Alpaca trades as a stock/ETF (also used for options collection)
# crypto: Alpaca crypto pairs, format SYMBOL/USD
# futures: Yahoo Finance continuous-contract tickers (format SYMBOL=F) — Alpaca has
# no futures data at all, so these are collected from a separate free source

equities:
  broad_market:
    - SPY
    - QQQ
    - IWM
  large_cap:
    - AAPL
    - MSFT
    - NVDA
    - AMZN
    - GOOGL
    - META
    - TSLA
    - FICO
    - JPM
    - V
    - UNH
    - PG
    - MA
    - HD
    - SPCX
    - AVGO
    - LLY
    - ASML
  defensive:
    - TLT
    - SHV
  sectors:
    - XLE
    - XLU
    - XLP
    - XLC
    - XLV
  alternative:
    - GLD
    - SLV

crypto:
  - BTC/USD
  - ETH/USD

futures:
  - MNQ=F  # Micro E-mini Nasdaq-100 (QQQ-linked)
  - MES=F  # Micro E-mini S&P 500 (SPY-linked)
  - SIL=F  # Micro Silver (SLV-linked)
