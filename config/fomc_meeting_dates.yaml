# Scheduled FOMC meeting decision dates (the second day of each two-day meeting,
# when the rate decision is announced). The Fed publishes these ~1-2 years in
# advance at https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
#
# This list is hand-maintained — add new dates as the Fed publishes future
# schedules, and double check upcoming entries against the link above since
# schedules occasionally shift. The collector cross-references each date
# against FRED's DFEDTARU/DFEDTARL series to determine the actual decision,
# so entries here only need the date.

meetings:
